<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>和小鲸聊天</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header>
      <span class="title">和小鲸聊天</span>
      <button id="clear" title="清空全部聊天记录">清空记录</button>
    </header>

    <main id="list"></main>

    <footer>
      <input id="input" type="text" placeholder="跟小鲸说点什么…" maxlength="200" autocomplete="off" />
      <button id="send">发送</button>
    </footer>

    <script src="chat.js"></script>
  </body>
</html>
