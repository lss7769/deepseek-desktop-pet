<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: rgba(75, 139, 245, 0.06);
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      #hint {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(29, 53, 87, 0.88);
        color: #fff;
        font-size: 14px;
        padding: 10px 22px;
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(29, 53, 87, 0.35);
        pointer-events: none;
        animation: fadein 0.2s ease;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="hint">🐳 点一下想让小鲸走过去的位置 · 按 Esc 取消</div>
    <script>
      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        window.petAPI.pickWalkPoint(e.clientX, e.clientY);
      }, { once: true });
      document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
  </body>
</html>
